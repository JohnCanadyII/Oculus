[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oculus-intel"
version = "0.1.0"
description = "Keyless security + networking/enterprise-tech news & CVE intelligence engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "John Canady II" }]
keywords = ["security", "cve", "kev", "epss", "rss", "threat-intelligence", "networking"]
dependencies = [
    "feedparser>=6.0",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.0"]

[project.urls]
Homepage = "https://github.com/JohnCanadyII/oculus"
Repository = "https://github.com/JohnCanadyII/oculus"

[project.scripts]
oculus = "oculus.cli:main"

[tool.setuptools]
packages = ["oculus"]

[tool.setuptools.package-data]
oculus = ["sources.yaml"]
